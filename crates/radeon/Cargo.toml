[package]
name = "radeon"
description = "ATI Radeon 9700 (R300) display adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
snapshot = { path = "../snapshot" }
vga = { path = "../vga" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLBuffer", "MTLResource", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLLibrary", "MTLTypes", "MTLPixelFormat", "MTLAllocation", "block2", "objc2-core-foundation"] }
