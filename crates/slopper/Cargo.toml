[package]
name = "slopper"
description = "x86-32 PC emulator for Apple Silicon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["window"]
window = ["dep:minifb"]

[dependencies]
minifb = { version = "0.29", optional = true }
pc = { path = "../pc" }
png = "0.18"
jit = { path = "../jit" }
x86 = { path = "../x86" }
