[package]
name = "slopper"
description = "x86-32 PC emulator for Apple Silicon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["window"]
window = ["dep:minifb"]

[dependencies]
minifb = { version = "0.29", optional = true }
ac97 = { path = "../ac97" }
pc = { path = "../pc" }
flate2 = "1.1"
png = "0.18"
usb = { path = "../usb" }
jit = { path = "../jit" }
net = { path = "../net" }
x86 = { path = "../x86" }
